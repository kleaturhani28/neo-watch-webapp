<section class="glass-card results-card" id="asteroidListContainer">

  <div class="section-title">
    <div>
      <h2>Lista asteroidi</h2>
    </div>

    <div class="toolbar-actions">
      <button class="btn btn-sm btn-ghost"
              hx-get="/asteroids"
              hx-include="#asteroidFilters"
              hx-target="#monitoringContainer"
              hx-swap="outerHTML">
        <i class="fa-solid fa-arrows-rotate me-1"></i>
        Aggiorna
      </button>

      <button class="btn btn-sm btn-ghost"
              hx-get="/asteroids/export"
              hx-include="#asteroidFilters"
              hx-target="#toast-target"
              hx-swap="innerHTML">
        <i class="fa-solid fa-file-export me-1"></i>
        Export
      </button>
    </div>
  </div>

  <div id="asteroid-results">

    @if (asteroids.Count > 0) {

      <div class="asteroid-list">
        @ForEach (var Asteroid in asteroids) {
          @Import Partials/Monitoring/AsteroidCard { @Asteroid }
        }
      </div>

    } @else {

      <div class="detail-empty">
        <div>
          <i class="fa-solid fa-meteor fa-2x mb-3 text-info"></i>
          <h4>Nessun asteroide trovato</h4>
          <p class="mb-0">
            Cambia range date oppure modifica i filtri.
          </p>
        </div>
      </div>

    }

  </div>

</section>
